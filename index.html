<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Count</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #e8eaed;
    --muted: #8a8f98;
    --accent: #4f8cff;
    --accent2: #34c77b;
    --danger: #ff5d5d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
  }
  h1 { font-size: 1.1rem; font-weight: 600; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 28px 36px;
    width: 100%;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,.35);
  }
  .card h2 { font-size: .8rem; font-weight: 600; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; }
  .clock { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .date { color: var(--muted); margin-top: 4px; font-size: .95rem; }
  .display { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 16px; }
  .btns { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
  button {
    border: none;
    border-radius: 10px;
    padding: 10px 22px;
    font-size: .95rem;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: var(--accent);
    transition: opacity .15s;
  }
  button:hover { opacity: .85; }
  button.stop { background: var(--danger); }
  button.reset { background: #3a3f4b; }
  .inputs { display: flex; gap: 8px; justify-content: center; margin-bottom: 16px; }
  .inputs input {
    width: 64px;
    padding: 8px;
    border-radius: 8px;
    border: 1px solid #333845;
    background: #12141a;
    color: var(--text);
    font-size: 1rem;
    text-align: center;
  }
  .inputs input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .done { color: var(--accent2); }
  .nav { color: var(--muted); font-size: .9rem; }
  .nav a { color: var(--accent); text-decoration: none; font-weight: 600; }
  .nav a:hover { text-decoration: underline; }
</style>
</head>
<body>

<h1>⏱ Time Count</h1>

<div class="card">
  <h2>Current Time</h2>
  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="date"></div>
</div>

<div class="card">
  <h2>Stopwatch</h2>
  <div class="display" id="swDisplay">00:00.00</div>
  <div class="btns">
    <button id="swStart">Start</button>
    <button id="swReset" class="reset">Reset</button>
  </div>
</div>

<div class="card">
  <h2>Countdown</h2>
  <div class="inputs">
    <input type="number" id="cdMin" min="0" max="999" value="5" aria-label="minutes"> <span style="align-self:center">min</span>
    <input type="number" id="cdSec" min="0" max="59" value="0" aria-label="seconds"> <span style="align-self:center">sec</span>
  </div>
  <div class="display" id="cdDisplay">05:00</div>
  <div class="btns">
    <button id="cdStart">Start</button>
    <button id="cdReset" class="reset">Reset</button>
  </div>
</div>

<p class="nav">Playing with friends? → <a href="./imposter/">🕵️ Imposter word game</a></p>

<script>
// ---- Live clock ----
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
function tickClock() {
  const now = new Date();
  clockEl.textContent = now.toLocaleTimeString('en-GB');
  dateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}
tickClock();
setInterval(tickClock, 250);

// ---- Stopwatch ----
const swDisplay = document.getElementById('swDisplay');
const swStartBtn = document.getElementById('swStart');
let swRunning = false, swStartAt = 0, swElapsed = 0, swTimer = null;

function fmtSw(ms) {
  const m = Math.floor(ms / 60000);
  const s = Math.floor(ms / 1000) % 60;
  const cs = Math.floor(ms / 10) % 100;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}.${String(cs).padStart(2,'0')}`;
}
swStartBtn.addEventListener('click', () => {
  if (!swRunning) {
    swRunning = true;
    swStartAt = Date.now() - swElapsed;
    swStartBtn.textContent = 'Stop';
    swStartBtn.classList.add('stop');
    swTimer = setInterval(() => {
      swElapsed = Date.now() - swStartAt;
      swDisplay.textContent = fmtSw(swElapsed);
    }, 33);
  } else {
    swRunning = false;
    clearInterval(swTimer);
    swStartBtn.textContent = 'Start';
    swStartBtn.classList.remove('stop');
  }
});
document.getElementById('swReset').addEventListener('click', () => {
  swRunning = false;
  clearInterval(swTimer);
  swElapsed = 0;
  swDisplay.textContent = '00:00.00';
  swStartBtn.textContent = 'Start';
  swStartBtn.classList.remove('stop');
});

// ---- Countdown ----
const cdDisplay = document.getElementById('cdDisplay');
const cdStartBtn = document.getElementById('cdStart');
const cdMin = document.getElementById('cdMin');
const cdSec = document.getElementById('cdSec');
let cdRunning = false, cdEndAt = 0, cdTimer = null;

function fmtCd(ms) {
  const total = Math.max(0, Math.ceil(ms / 1000));
  const m = Math.floor(total / 60);
  const s = total % 60;
  return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
}
function cdInputMs() {
  return ((parseInt(cdMin.value) || 0) * 60 + (parseInt(cdSec.value) || 0)) * 1000;
}
[cdMin, cdSec].forEach(el => el.addEventListener('input', () => {
  if (!cdRunning) cdDisplay.textContent = fmtCd(cdInputMs());
}));
cdStartBtn.addEventListener('click', () => {
  if (!cdRunning) {
    const ms = cdInputMs();
    if (ms <= 0) return;
    cdRunning = true;
    cdEndAt = Date.now() + ms;
    cdDisplay.classList.remove('done');
    cdStartBtn.textContent = 'Stop';
    cdStartBtn.classList.add('stop');
    cdTimer = setInterval(() => {
      const left = cdEndAt - Date.now();
      cdDisplay.textContent = fmtCd(left);
      if (left <= 0) {
        clearInterval(cdTimer);
        cdRunning = false;
        cdDisplay.textContent = "Time's up!";
        cdDisplay.classList.add('done');
        cdStartBtn.textContent = 'Start';
        cdStartBtn.classList.remove('stop');
      }
    }, 200);
  } else {
    cdRunning = false;
    clearInterval(cdTimer);
    cdStartBtn.textContent = 'Start';
    cdStartBtn.classList.remove('stop');
  }
});
document.getElementById('cdReset').addEventListener('click', () => {
  cdRunning = false;
  clearInterval(cdTimer);
  cdDisplay.classList.remove('done');
  cdDisplay.textContent = fmtCd(cdInputMs());
  cdStartBtn.textContent = 'Start';
  cdStartBtn.classList.remove('stop');
});
</script>

</body>
</html>
