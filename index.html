<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Time Keeper</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #1a1d24;
    --text: #e8eaed;
    --muted: #8a8f98;
    --accent: #4f8cff;
    --green: #34c77b;
    --danger: #ff5d5d;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 24px;
    padding: 24px;
  }
  h1 { font-size: 1.1rem; font-weight: 600; color: var(--muted); letter-spacing: 2px; text-transform: uppercase; }
  .card {
    background: var(--card);
    border-radius: 16px;
    padding: 28px 36px;
    width: 100%;
    max-width: 440px;
    text-align: center;
    box-shadow: 0 4px 24px rgba(0,0,0,.35);
  }
  .card h2 { font-size: .8rem; font-weight: 600; color: var(--muted); letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 12px; }
  .clock { font-size: 3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
  .date { color: var(--muted); margin-top: 4px; font-size: .95rem; }
  .status { font-size: 1rem; margin-bottom: 6px; color: var(--muted); }
  .status.in { color: var(--green); font-weight: 600; }
  .elapsed { font-size: 2.6rem; font-weight: 700; font-variant-numeric: tabular-nums; margin-bottom: 16px; }
  button {
    border: none;
    border-radius: 10px;
    padding: 12px 28px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    color: #fff;
    background: var(--green);
    transition: opacity .15s;
  }
  button:hover { opacity: .85; }
  button.out { background: var(--danger); }
  button.clear { background: #3a3f4b; font-size: .85rem; padding: 8px 16px; margin-top: 14px; }
  table { width: 100%; border-collapse: collapse; font-size: .9rem; }
  th, td { padding: 8px 4px; text-align: center; }
  th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: 1px; border-bottom: 1px solid #2a2e38; }
  td { border-bottom: 1px solid #22262f; font-variant-numeric: tabular-nums; }
  .total { margin-top: 12px; font-weight: 600; }
  .total span { color: var(--accent); }
  .empty { color: var(--muted); font-size: .9rem; padding: 12px 0; }
</style>
</head>
<body>

<h1>⏱ Time Keeper</h1>

<div class="card">
  <h2>Current Time</h2>
  <div class="clock" id="clock">--:--:--</div>
  <div class="date" id="date"></div>
</div>

<div class="card">
  <h2>Work</h2>
  <div class="status" id="status">Clocked out</div>
  <div class="elapsed" id="elapsed">00:00:00</div>
  <button id="punchBtn">Clock In</button>
</div>

<div class="card">
  <h2>Log</h2>
  <div id="logWrap"></div>
  <div class="total">Total: <span id="total">0h 00m</span></div>
  <button class="clear" id="clearBtn">Clear log</button>
</div>

<script>
// ---- Live clock ----
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
function tickClock() {
  const now = new Date();
  clockEl.textContent = now.toLocaleTimeString('en-GB');
  dateEl.textContent = now.toLocaleDateString(undefined, { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
}
tickClock();
setInterval(tickClock, 250);

// ---- Timekeeper ----
const statusEl = document.getElementById('status');
const elapsedEl = document.getElementById('elapsed');
const punchBtn = document.getElementById('punchBtn');
const logWrap = document.getElementById('logWrap');
const totalEl = document.getElementById('total');

let entries = JSON.parse(localStorage.getItem('tk_entries') || '[]');
let clockInAt = JSON.parse(localStorage.getItem('tk_in') || 'null');

function fmtHMS(ms) {
  const s = Math.floor(ms / 1000);
  return [Math.floor(s / 3600), Math.floor(s / 60) % 60, s % 60]
    .map(n => String(n).padStart(2, '0')).join(':');
}
function fmtDur(ms) {
  const m = Math.floor(ms / 60000);
  return `${Math.floor(m / 60)}h ${String(m % 60).padStart(2, '0')}m`;
}
function fmtTime(ts) {
  return new Date(ts).toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
}
function fmtDay(ts) {
  return new Date(ts).toLocaleDateString(undefined, { month: 'short', day: 'numeric' });
}

function save() {
  localStorage.setItem('tk_entries', JSON.stringify(entries));
  localStorage.setItem('tk_in', JSON.stringify(clockInAt));
}

function renderLog() {
  if (!entries.length) {
    logWrap.innerHTML = '<div class="empty">No shifts yet — clock in to start.</div>';
  } else {
    const rows = entries.slice().reverse().map(e =>
      `<tr><td>${fmtDay(e.in)}</td><td>${fmtTime(e.in)}</td><td>${fmtTime(e.out)}</td><td>${fmtDur(e.out - e.in)}</td></tr>`
    ).join('');
    logWrap.innerHTML = `<table><thead><tr><th>Day</th><th>In</th><th>Out</th><th>Time</th></tr></thead><tbody>${rows}</tbody></table>`;
  }
  totalEl.textContent = fmtDur(entries.reduce((sum, e) => sum + (e.out - e.in), 0));
}

function renderStatus() {
  if (clockInAt) {
    statusEl.textContent = 'Clocked in since ' + fmtTime(clockInAt);
    statusEl.classList.add('in');
    punchBtn.textContent = 'Clock Out';
    punchBtn.classList.add('out');
  } else {
    statusEl.textContent = 'Clocked out';
    statusEl.classList.remove('in');
    punchBtn.textContent = 'Clock In';
    punchBtn.classList.remove('out');
    elapsedEl.textContent = '00:00:00';
  }
}

setInterval(() => {
  if (clockInAt) elapsedEl.textContent = fmtHMS(Date.now() - clockInAt);
}, 250);

punchBtn.addEventListener('click', () => {
  if (!clockInAt) {
    clockInAt = Date.now();
  } else {
    entries.push({ in: clockInAt, out: Date.now() });
    clockInAt = null;
  }
  save();
  renderStatus();
  renderLog();
});

document.getElementById('clearBtn').addEventListener('click', () => {
  if (!confirm('Clear the whole log?')) return;
  entries = [];
  save();
  renderLog();
});

renderStatus();
renderLog();
</script>

</body>
</html>
