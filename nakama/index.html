<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Nakama</title>
<meta name="description" content="Five pass-the-phone games that get friends past small talk — question cards, guessing rounds and voting.">
<meta name="theme-color" content="#EDEEEA">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍵</text></svg>">
<style>
  /* ---------- tokens: light is the base ---------- */
  :root {
    --ground: #EDEEEA;
    --surface: #F7F8F5;
    --line: #D7D9D2;
    --ink: #1F2229;
    --muted: #6E746C;
    --btn-bg: #1F2229;
    --btn-fg: #F7F8F5;

    --asagi: #2E7373;
    --yamabuki: #96690E;
    --suou: #7A3244;
    --card-fg: #FCFBF7;

    --font-display: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif JP", "Songti SC", Georgia, "Times New Roman", serif;
    --font-body: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Segoe UI", Roboto, sans-serif;
    --font-num: ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --ground: #16191A;
      --surface: #1E2223;
      --line: #2F3435;
      --ink: #E9EAE6;
      --muted: #949B95;
      --btn-bg: #E9EAE6;
      --btn-fg: #16191A;
    }
  }
  :root[data-theme="dark"] {
    --ground: #16191A;
    --surface: #1E2223;
    --line: #2F3435;
    --ink: #E9EAE6;
    --muted: #949B95;
    --btn-bg: #E9EAE6;
    --btn-fg: #16191A;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  [hidden] { display: none !important; }
  html, body { height: 100%; }
  body {
    font-family: var(--font-body);
    background: var(--ground);
    color: var(--ink);
    min-height: 100%;
    display: flex;
    justify-content: center;
    padding: 22px 18px calc(32px + env(safe-area-inset-bottom));
    line-height: 1.5;
  }
  .wrap { width: 100%; max-width: 440px; display: flex; flex-direction: column; gap: 22px; }

  /* ---------- type ---------- */
  .eyebrow {
    font-size: .7rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase;
    color: var(--muted);
    display: flex; align-items: baseline; gap: .6em;
  }
  .eyebrow .ja { letter-spacing: .08em; font-weight: 600; }
  h1 { font-family: var(--font-display); font-size: 2rem; font-weight: 600; letter-spacing: .02em; }
  h1 .ja { font-size: 1.5rem; color: var(--muted); margin-left: .35em; }
  .lede { color: var(--muted); font-size: .9rem; margin-top: 4px; }

  /* ---------- buttons ---------- */
  button {
    font-family: inherit; font-size: 1rem; font-weight: 600;
    border: none; border-radius: 10px; cursor: pointer;
    padding: 15px 18px;
    background: var(--btn-bg); color: var(--btn-fg);
    transition: transform .09s ease, opacity .15s ease;
  }
  button:active { transform: scale(.985); }
  button:focus-visible { outline: 3px solid var(--asagi); outline-offset: 2px; }
  button:disabled { opacity: .35; cursor: not-allowed; }
  .block { width: 100%; }
  .quiet {
    background: transparent; color: var(--ink);
    border: 1px solid var(--line); font-weight: 600;
  }
  .pair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

  /* ---------- players ---------- */
  .panel { display: flex; flex-direction: column; gap: 12px; }
  .roster { display: flex; flex-wrap: wrap; gap: 7px; }
  .who-chip {
    display: inline-flex; align-items: center; gap: 7px;
    padding: 7px 9px 7px 13px; border-radius: 999px;
    background: var(--surface); border: 1px solid var(--line);
    font-size: .9rem; font-weight: 600;
  }
  .who-chip button {
    all: unset; cursor: pointer; color: var(--muted);
    width: 19px; height: 19px; border-radius: 50%;
    display: grid; place-items: center; font-size: .95rem; line-height: 1;
  }
  .who-chip button:hover { color: var(--suou); }
  .add-row { display: flex; gap: 8px; }
  .add-row input {
    flex: 1; min-width: 0;
    font-family: inherit; font-size: 1rem;
    padding: 13px 14px; border-radius: 10px;
    border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  }
  .add-row input::placeholder { color: var(--muted); }
  .add-row input:focus { outline: 2px solid var(--ink); outline-offset: -1px; border-color: transparent; }
  .add-row button { flex: 0 0 auto; padding: 13px 20px; }

  /* ---------- mode list ---------- */
  .modes { display: flex; flex-direction: column; }
  .mode {
    all: unset; cursor: pointer;
    display: grid; grid-template-columns: 34px 1fr; gap: 14px; align-items: baseline;
    padding: 16px 2px; border-top: 1px solid var(--line);
  }
  .modes .mode:last-child { border-bottom: 1px solid var(--line); }
  .mode:focus-visible { outline: 2px solid var(--asagi); outline-offset: 2px; }
  .mode .mark { font-family: var(--font-display); font-size: 1.5rem; line-height: 1; }
  .mode .t { display: block; font-family: var(--font-display); font-size: 1.22rem; font-weight: 600; }
  .mode .t .ja { font-family: var(--font-body); font-size: .8rem; font-weight: 600; color: var(--muted); margin-left: .5em; letter-spacing: .04em; }
  .mode .d { display: block; font-size: .85rem; color: var(--muted); margin-top: 3px; }
  .level .lt, .level .ld { display: block; }

  /* ---------- the card ---------- */
  .card {
    background: var(--fill, var(--asagi));
    color: var(--card-fg);
    border-radius: 14px;
    padding: 30px 24px 26px;
    min-height: 300px;
    display: flex; flex-direction: column; gap: 16px;
    box-shadow: 0 10px 30px -14px rgba(0,0,0,.55);
  }
  .card.l1 { --fill: var(--asagi); }
  .card.l2 { --fill: var(--yamabuki); }
  .card.l3 { --fill: var(--suou); }
  .card .eyebrow { color: rgba(252,251,247,.72); }
  .card .q {
    font-family: var(--font-display);
    font-size: 1.75rem; line-height: 1.32; font-weight: 600;
    text-wrap: balance;
  }
  .card .q-ja {
    font-size: 1rem; line-height: 1.6; color: rgba(252,251,247,.82);
    margin-top: -4px;
  }
  .card .foot { margin-top: auto; font-size: .85rem; color: rgba(252,251,247,.78); }
  .card .foot b { color: var(--card-fg); font-size: 1rem; }
  .card-anim { animation: rise .26s cubic-bezier(.2,.7,.3,1); }
  @keyframes rise { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .card-anim { animation: none; } }

  /* ---------- level picker ---------- */
  .levels { display: flex; flex-direction: column; gap: 8px; }
  .level {
    all: unset; cursor: pointer;
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px; border-radius: 10px;
    background: var(--surface); border: 1px solid var(--line);
  }
  .level:focus-visible { outline: 2px solid var(--asagi); outline-offset: 2px; }
  .level .dot { width: 11px; height: 11px; border-radius: 50%; flex: 0 0 auto; }
  .level .lt { font-weight: 700; font-size: .98rem; }
  .level .ld { font-size: .82rem; color: var(--muted); margin-top: 1px; }

  /* ---------- countdown ---------- */
  .count {
    font-family: var(--font-display);
    font-size: 5.5rem; line-height: 1; text-align: center;
    color: var(--card-fg);
  }
  .count.go { font-size: 3rem; }

  /* ---------- timer ---------- */
  .clock {
    font-family: var(--font-num); font-variant-numeric: tabular-nums;
    font-size: 3.4rem; text-align: center; letter-spacing: -.02em;
  }
  .clock.low { color: #C4677C; }

  /* ---------- scoring ---------- */
  .tap-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .tap {
    all: unset; cursor: pointer;
    padding: 11px 16px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface);
    font-size: .95rem; font-weight: 600;
  }
  .tap[aria-pressed="true"] { background: var(--ink); color: var(--ground); border-color: var(--ink); }
  .tap:focus-visible { outline: 2px solid var(--asagi); outline-offset: 2px; }

  .board { display: flex; flex-direction: column; }
  .board .r {
    display: flex; justify-content: space-between; align-items: baseline;
    padding: 9px 0; border-top: 1px solid var(--line);
    font-size: .95rem;
  }
  .board .r:first-child { border-top: none; }
  .board .r b { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
  .board .r.top b { color: var(--yamabuki); }

  .note { font-size: .85rem; color: var(--muted); }
  .note b { color: var(--ink); font-weight: 600; }
  .screen { display: none; flex-direction: column; gap: 20px; }
  .screen.on { display: flex; }
  .err { color: var(--suou); font-size: .87rem; font-weight: 600; min-height: 1.2em; }
  footer { color: var(--muted); font-size: .78rem; text-align: center; }
  footer a { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">

<!-- ======================= HOME ======================= -->
<section class="screen on" id="s-home">
  <div>
    <h1>Nakama<span class="ja">仲間</span></h1>
    <p class="lede">Five games for one phone and a table of friends. Nothing to install, nobody sits out.</p>
  </div>

  <div class="panel">
    <div class="eyebrow">Who's here <span class="ja">メンバー</span></div>
    <div class="roster" id="roster"></div>
    <div class="add-row">
      <input id="nameInput" type="text" placeholder="Add a name" maxlength="14" autocomplete="off" enterkeyhint="done">
      <button id="addBtn">Add</button>
    </div>
    <div class="err" id="homeErr"></div>
  </div>

  <div class="modes" id="modes"></div>

  <div class="panel" id="boardPanel" hidden>
    <div class="eyebrow">Scores <span class="ja">得点</span></div>
    <div class="board" id="board"></div>
    <button class="quiet" id="clearScores">Clear scores</button>
  </div>

  <footer>Play in order, or hop between games. <a href="../imposter/">🕵️ Imposter</a></footer>
</section>

<!-- ======================= DEEP CUTS ======================= -->
<section class="screen" id="s-deep">
  <div class="eyebrow">Question cards <span class="ja">質問カード</span></div>
  <div id="deepPick" class="levels"></div>
  <div id="deepCardHost"></div>
  <div id="deepControls"></div>
  <button class="quiet block" data-home>Back</button>
</section>

<!-- ======================= GUESS ME ======================= -->
<section class="screen" id="s-guess">
  <div class="eyebrow">Guess me <span class="ja">せーの、当てて</span></div>
  <div id="guessHost"></div>
  <div id="guessControls"></div>
  <button class="quiet block" data-home>Back</button>
</section>

<!-- ======================= MOST LIKELY TO ======================= -->
<section class="screen" id="s-likely">
  <div class="eyebrow">Most likely to <span class="ja">一番ありそうな人</span></div>
  <div id="likelyHost"></div>
  <div id="likelyControls"></div>
  <button class="quiet block" data-home>Back</button>
</section>

<!-- ======================= TWO TRUTHS ======================= -->
<section class="screen" id="s-truths">
  <div class="eyebrow">Two truths, one lie <span class="ja">嘘はどれ</span></div>
  <div id="truthsHost"></div>
  <div id="truthsControls"></div>
  <button class="quiet block" data-home>Back</button>
</section>

<!-- ======================= HOT SEAT ======================= -->
<section class="screen" id="s-hot">
  <div class="eyebrow">Hot seat <span class="ja">60秒</span></div>
  <div id="hotHost"></div>
  <div id="hotControls"></div>
  <button class="quiet block" data-home>Back</button>
</section>

</div>

const MODES = [
  { id: "deep",   mark: "問", t: "Deep Cuts",       ja: "質問カード",   d: "Question cards in three depths. Answer, then take one follow-up.", min: 2 },
  { id: "guess",  mark: "推", t: "Guess Me",        ja: "せーの、当てて", d: "Everyone guesses your answer at once. Points for whoever knows you.", min: 3 },
  { id: "likely", mark: "指", t: "Most Likely To",  ja: "一番ありそう",  d: "Countdown, then everyone points at once. Loudest laugh wins.", min: 3 },

/* =====================================================================
   State
   ===================================================================== */
const $ = id => document.getElementById(id);
const store = {
  get(k, d) { try { const v = localStorage.getItem("nakama." + k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem("nakama." + k, JSON.stringify(v)); } catch (e) {} },
};

let players = store.get("players", []);
let scores = store.get("scores", {});
let seen = store.get("seen", {});          // deck-key -> array of used indexes
let turn = store.get("turn", 0);           // rotating subject index

function savePlayers() { store.set("players", players); }
function saveScores() { store.set("scores", scores); }

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

/* Draw without repeats until the deck is exhausted. */
function draw(key, deck) {
  let used = seen[key] || [];
  if (used.length >= deck.length) used = [];
  const open = deck.map((_, i) => i).filter(i => !used.includes(i));
  const idx = open[Math.floor(Math.random() * open.length)];
  seen[key] = used.concat(idx);
  store.set("seen", seen);
  return deck[idx];
}

function otherThan(i) {
  return players.map((n, j) => j).filter(j => j !== i);
}

function award(name, n) {
  scores[name] = (scores[name] || 0) + n;
  saveScores();
}

/* =====================================================================
   Home
   ===================================================================== */
function renderRoster() {
  const box = $("roster");
  box.innerHTML = "";
  if (!players.length) {
    box.innerHTML = '<span class="note">Add everyone at the table — names show up inside the games.</span>';
  }
  players.forEach((n, i) => {
    const chip = document.createElement("span");
    chip.className = "who-chip";
    chip.innerHTML = esc(n);
    const x = document.createElement("button");
    x.type = "button";
    x.setAttribute("aria-label", "Remove " + n);
    x.textContent = "×";
    x.addEventListener("click", () => {
      players.splice(i, 1);
      savePlayers();
      renderRoster();
      renderBoard();
    });
    chip.appendChild(x);
    box.appendChild(chip);
  });
}

function addPlayer() {
  const input = $("nameInput");
  const name = input.value.trim();
  $("homeErr").textContent = "";
  if (!name) return;
  if (players.some(p => p.toLowerCase() === name.toLowerCase())) {
    $("homeErr").textContent = "That name is already in.";
    return;
  }
  if (players.length >= 14) {
    $("homeErr").textContent = "Fourteen is plenty.";
    return;
  }
  players.push(name);
  savePlayers();
  input.value = "";
  input.focus();
  renderRoster();
  renderBoard();
}
$("addBtn").addEventListener("click", addPlayer);
$("nameInput").addEventListener("keydown", e => { if (e.key === "Enter") addPlayer(); });

function renderModes() {
  const box = $("modes");
  box.innerHTML = "";
  MODES.forEach(m => {
    const el = document.createElement("button");
    el.className = "mode";
    el.type = "button";
    el.innerHTML =
      `<span class="mark">${m.mark}</span>
       <span><span class="t">${esc(m.t)}<span class="ja">${esc(m.ja)}</span></span>
       <span class="d">${esc(m.d)}</span></span>`;
    el.addEventListener("click", () => {
      if (players.length < m.min) {
        $("homeErr").textContent = `${m.t} needs at least ${m.min} people. Add names above.`;
        $("nameInput").focus();
        return;
      }
      $("homeErr").textContent = "";
      START[m.id]();
    });
    box.appendChild(el);
  });
}

function renderBoard() {
  const names = players.filter(p => scores[p]);
  $("boardPanel").hidden = names.length === 0;
  const box = $("board");
  box.innerHTML = "";
  const top = Math.max(...names.map(n => scores[n]), 0);
  names.sort((a, b) => scores[b] - scores[a]).forEach(n => {
    const r = document.createElement("div");
    r.className = "r" + (scores[n] === top ? " top" : "");
    r.innerHTML = `<span>${esc(n)}</span><b>${scores[n]}</b>`;
    box.appendChild(r);
  });
}
$("clearScores").addEventListener("click", () => {
  scores = {};
  saveScores();
  renderBoard();
});

function show(id) {
  document.querySelectorAll(".screen").forEach(s => s.classList.toggle("on", s.id === id));
  window.scrollTo(0, 0);
}
function home() {
  stopClock();
  renderRoster();
  renderBoard();
  show("s-home");
}
document.querySelectorAll("[data-home]").forEach(b => b.addEventListener("click", home));

/* Small builders shared by the modes. */
function card(level, inner) {
  return `<div class="card l${level} card-anim">${inner}</div>`;
}
function btn(label, onClick, quiet) {
  const b = document.createElement("button");
  b.className = "block" + (quiet ? " quiet" : "");
  b.textContent = label;
  b.addEventListener("click", onClick);
  return b;
}
function controls(host, ...els) {
  const box = $(host);
  box.innerHTML = "";
  box.style.display = "flex";
  box.style.flexDirection = "column";
  box.style.gap = "10px";
  els.filter(Boolean).forEach(e => box.appendChild(e));
}

/* =====================================================================
   Mode: Deep Cuts
   ===================================================================== */
const LEVELS = [
  { n: 1, color: "var(--asagi)",    t: "Level 1 — Warm up",  ja: "軽く",  d: "Easy, funny, no pressure." },
  { n: 2, color: "var(--yamabuki)", t: "Level 2 — Honest",   ja: "本音",  d: "Real answers. Still comfortable." },
  { n: 3, color: "var(--suou)",     t: "Level 3 — Deep",     ja: "深く",  d: "Vulnerable. Anyone may pass." },
];
let deepLevel = 0;

function startDeep() {
  deepLevel = 0;
  $("deepCardHost").innerHTML = "";
  $("deepControls").innerHTML = "";
  const box = $("deepPick");
  box.hidden = false;
  box.innerHTML = "";
  LEVELS.forEach(l => {
    const el = document.createElement("button");
    el.className = "level";
    el.type = "button";
    el.innerHTML =
      `<span class="dot" style="background:${l.color}"></span>
       <span><span class="lt">${l.t} <span style="color:var(--muted);font-weight:600">${l.ja}</span></span>
       <span class="ld">${l.d}</span></span>`;
    el.addEventListener("click", () => { deepLevel = l.n; deepCard(); });
    box.appendChild(el);
  });
  show("s-deep");
}

function deepCard() {
  $("deepPick").hidden = true;
  const [en, ja] = draw("deep" + deepLevel, DEEP[deepLevel]);
  const who = players[Math.floor(Math.random() * players.length)];
  $("deepCardHost").innerHTML = card(deepLevel,
    `<div class="eyebrow">Level ${deepLevel} <span class="ja">${LEVELS[deepLevel - 1].ja}</span></div>
     <div class="q">${esc(en)}</div>
     <div class="q-ja">${esc(ja)}</div>
     <div class="foot">Answering: <b>${esc(who)}</b>${deepLevel === 3 ? " · passing is allowed" : ""}</div>`);
  controls("deepControls",
    btn("Next question", deepCard),
    btn("Everyone answers this one", () => {
      $("deepCardHost").querySelector(".foot").innerHTML = "<b>Everyone answers</b> — go around the circle.";
    }, true),
    btn("Change level", startDeep, true));
}

/* =====================================================================
   Mode: Guess Me
   ===================================================================== */
let gSubject = 0, gQuestion = null;

function startGuess() {
  gSubject = turn % players.length;
  guessAsk();
  show("s-guess");
}

function guessAsk() {
  const name = players[gSubject];
  const [en, ja] = draw("guess", GUESS);
  gQuestion = [en.replace(/\{n\}/g, name), ja.replace(/\{n\}/g, name)];
  $("guessHost").innerHTML = card(1,
    `<div class="eyebrow">About <span class="ja">${esc(name)}</span></div>
     <div class="q">${esc(gQuestion[0])}</div>
     <div class="q-ja">${esc(gQuestion[1])}</div>
     <div class="foot">Everyone except <b>${esc(name)}</b> says their guess out loud — together, on three.</div>`);
  controls("guessControls",
    btn("3・2・1 — say it together", guessCountdown),
    btn("Different question", guessAsk, true));
}

function guessCountdown() {
  let n = 3;
  const host = $("guessHost");
  const paint = () => {
    host.innerHTML = card(1, `<div class="count${n === 0 ? " go" : ""}">${n === 0 ? "せーの！" : n}</div>`);
  };
  paint();
  controls("guessControls");
  const iv = setInterval(() => {
    n--;
    paint();
    if (n === 0) {
      clearInterval(iv);
      setTimeout(guessReveal, 900);
    }
  }, 800);
}

function guessReveal() {
  const name = players[gSubject];
  $("guessHost").innerHTML = card(2,
    `<div class="eyebrow">The real answer <span class="ja">正解</span></div>
     <div class="q">${esc(gQuestion[0])}</div>
     <div class="foot"><b>${esc(name)}</b> — tell them the truth. Then score who was right.</div>`);
  controls("guessControls", btn("Score it", guessScore));
}

function guessScore() {
  const name = players[gSubject];
  const picked = new Set();
  $("guessHost").innerHTML =
    `<div class="panel">
       <div class="eyebrow">Who guessed right? <span class="ja">正解した人</span></div>
       <div class="tap-list" id="guessTaps"></div>
       <div class="note">Tap every name that got it. Each one takes a point — and if nobody did, <b>${esc(name)}</b> takes two for being unreadable.</div>
     </div>`;
  const taps = $("guessTaps");
  otherThan(gSubject).forEach(i => {
    const b = document.createElement("button");
    b.className = "tap";
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.textContent = players[i];
    b.addEventListener("click", () => {
      const on = b.getAttribute("aria-pressed") === "true";
      b.setAttribute("aria-pressed", on ? "false" : "true");
      if (on) picked.delete(players[i]); else picked.add(players[i]);
    });
    taps.appendChild(b);
  });
  controls("guessControls", btn("Next player", () => {
    if (picked.size) picked.forEach(p => award(p, 1));
    else award(name, 2);
    turn++; store.set("turn", turn);
    gSubject = turn % players.length;
    guessAsk();
  }), btn("Finish — see scores", () => {
    if (picked.size) picked.forEach(p => award(p, 1));
    else award(name, 2);
    turn++; store.set("turn", turn);
    home();
  }, true));
}

/* =====================================================================
   Mode: Most Likely To
   ===================================================================== */
function startLikely() { likelyCard(); show("s-likely"); }

    `<div class="eyebrow">Most likely to <span class="ja">一番ありそう</span></div>

     <div class="foot">On three, everyone points at one person. No talking first.</div>`);
  controls("likelyControls",
    btn("3・2・1 — point!", likelyCountdown),
    btn("Different one", likelyCard, true));
}

function likelyCountdown() {
  let n = 3;
  const paint = () => {
    $("likelyHost").innerHTML = card(2, `<div class="count${n === 0 ? " go" : ""}">${n === 0 ? "指さして！" : n}</div>`);
  };
  paint();
  controls("likelyControls");
  const iv = setInterval(() => {
    n--;
    paint();
    if (n === 0) { clearInterval(iv); setTimeout(likelyTally, 900); }
  }, 800);
}

function likelyTally() {
  $("likelyHost").innerHTML =
    `<div class="panel">
       <div class="eyebrow">Who got the most fingers? <span class="ja">一番指された人</span></div>
       <div class="tap-list" id="likelyTaps"></div>
       <div class="note">Tap the winner — they take the point, and they owe the table an explanation.</div>
     </div>`;
  const taps = $("likelyTaps");
  players.forEach(n => {
    const b = document.createElement("button");
    b.className = "tap";
    b.type = "button";
    b.textContent = n;
    b.addEventListener("click", () => { award(n, 1); likelyCard(); });
    taps.appendChild(b);
  });
  controls("likelyControls", btn("Tie — skip it", likelyCard, true), btn("Finish — see scores", home, true));
}

/* =====================================================================
   Mode: Two Truths, One Lie
   ===================================================================== */
let tSubject = 0;

function startTruths() {
  tSubject = turn % players.length;
  truthsThink();
  show("s-truths");
}

function truthsThink() {
  const name = players[tSubject];
  $("truthsHost").innerHTML = card(3,
    `<div class="eyebrow">Your turn <span class="ja">${esc(name)}</span></div>
     <div class="q">Think of two true things and one convincing lie about yourself.</div>
     <div class="q-ja">自分について、本当のこと2つと、うまい嘘を1つ考えて。</div>
     <div class="foot">Say all three in a row, in any order. Then the table votes.</div>`);
  controls("truthsControls",
    btn("Start 60 seconds", () => startClock(60, "truthsHost", "truthsControls", truthsVote)),
    btn("Skip the timer", truthsVote, true));
}

function truthsVote() {
  const name = players[tSubject];
  stopClock();
  const picked = new Set();
  $("truthsHost").innerHTML =
    `<div class="panel">
       <div class="eyebrow">Who spotted the lie? <span class="ja">嘘を見抜いた人</span></div>
       <div class="tap-list" id="truthsTaps"></div>
       <div class="note">Everyone votes out loud, then <b>${esc(name)}</b> reveals the lie. Tap whoever was right — a point each, or two for ${esc(name)} if the whole table fell for it.</div>
     </div>`;
  const taps = $("truthsTaps");
  otherThan(tSubject).forEach(i => {
    const b = document.createElement("button");
    b.className = "tap";
    b.type = "button";
    b.setAttribute("aria-pressed", "false");
    b.textContent = players[i];
    b.addEventListener("click", () => {
      const on = b.getAttribute("aria-pressed") === "true";
      b.setAttribute("aria-pressed", on ? "false" : "true");
      if (on) picked.delete(players[i]); else picked.add(players[i]);
    });
    taps.appendChild(b);
  });
  const settle = () => {
    if (picked.size) picked.forEach(p => award(p, 1));
    else award(name, 2);
    turn++; store.set("turn", turn);
  };
  controls("truthsControls",
    btn("Next player", () => { settle(); tSubject = turn % players.length; truthsThink(); }),
    btn("Finish — see scores", () => { settle(); home(); }, true));
}

/* =====================================================================
   Mode: Hot Seat
   ===================================================================== */
let hSubject = 0, hCount = 0;

function startHot() {
  hSubject = turn % players.length;
  hotIntro();
  show("s-hot");
}

function hotIntro() {
  const name = players[hSubject];
  $("hotHost").innerHTML = card(3,
    `<div class="eyebrow">Hot seat <span class="ja">60秒</span></div>
     <div class="q">${esc(name)}, sixty seconds. Short answers only.</div>
     <div class="q-ja">${esc(name)}、60秒。短く答えて。</div>
     <div class="foot">Someone else holds the phone and reads the questions out.</div>`);
  controls("hotControls",
    btn("Start", () => { hCount = 0; startClock(60, null, null, hotDone); hotQuestion(); }),
    btn("Someone else goes", () => {
      turn++; store.set("turn", turn);
      hSubject = turn % players.length;
      hotIntro();
    }, true));
}

function hotQuestion() {
  const [en, ja] = draw("hot", HOT);
  const host = $("hotHost");
  host.innerHTML = card(3,
    `<div class="eyebrow">${esc(players[hSubject])} <span class="ja">${hCount} answered</span></div>
     <div class="q">${esc(en)}</div>
     <div class="q-ja">${esc(ja)}</div>
     <div class="clock" id="hotClock" style="text-align:left;font-size:1.6rem"></div>`);
  paintClock();
  controls("hotControls",
    btn("Answered — next", () => { hCount++; hotQuestion(); }),
    btn("Pass", hotQuestion, true));
}

function hotDone() {
  const name = players[hSubject];
  award(name, hCount);
  $("hotHost").innerHTML = card(1,
    `<div class="eyebrow">Time <span class="ja">終了</span></div>
     <div class="q">${esc(name)} got through ${hCount} question${hCount === 1 ? "" : "s"}.</div>
     <div class="foot">That's ${hCount} point${hCount === 1 ? "" : "s"}. Pass the phone on.</div>`);
  controls("hotControls",
    btn("Next player", () => {
      turn++; store.set("turn", turn);
      hSubject = turn % players.length;
      hotIntro();
    }),
    btn("Finish — see scores", home, true));
}

/* =====================================================================
   Shared countdown clock
   ===================================================================== */
let clockId = null, clockLeft = 0, clockEnd = null;

function paintClock() {
  const el = $("hotClock") || $("bigClock");
  if (!el) return;
  el.textContent = clockLeft + "s";
  el.classList.toggle("low", clockLeft <= 10);
}

function startClock(secs, hostId, controlsId, onEnd) {
  stopClock();
  clockLeft = secs;
  clockEnd = onEnd;
  if (hostId) {
    $(hostId).innerHTML = card(3, `<div class="eyebrow">Thinking time <span class="ja">考え中</span></div><div class="clock" id="bigClock">${secs}s</div>`);
    if (controlsId) controls(controlsId, btn("Ready — skip ahead", () => { stopClock(); onEnd(); }, true));
  }
  const endAt = Date.now() + secs * 1000;
  clockId = setInterval(() => {
    clockLeft = Math.max(0, Math.round((endAt - Date.now()) / 1000));
    paintClock();
    if (clockLeft <= 0) {
      stopClock();
      if (navigator.vibrate) navigator.vibrate([180, 90, 180]);
      onEnd();
    }
  }, 200);
}

function stopClock() {
  if (clockId) clearInterval(clockId);
  clockId = null;
}

/* =====================================================================
   Boot
   ===================================================================== */
const START = { deep: startDeep, guess: startGuess, likely: startLikely, truths: startTruths, hot: startHot };

renderRoster();
renderModes();
renderBoard();
</script>
