<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Path to 30</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style id="p30-style">
:root{
  color-scheme:light;
  --bg:#f5f6f2; --surface:#fdfdfb; --surface-2:#f0f1ec;
  --ink:#181d19; --ink-2:#5a625b; --ink-3:#8b928b;
  --line:#e3e5dc; --line-2:#d3d6cc;
  --accent:#1b6e5a; --accent-ink:#ffffff; --accent-soft:#e0ede8;
  --good:#0ca30c; --warn:#c98500;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --s5:#e87ba4; --s6:#008300; --s7:#4a3aa7; --s8:#e34948;
  --grid:#e1e0d9; --axis:#c3c2b7;
  --shadow:0 1px 2px rgba(20,25,20,.05),0 4px 14px rgba(20,25,20,.05);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0f1211; --surface:#171b19; --surface-2:#1e2320;
    --ink:#f0f2ee; --ink-2:#a7aea7; --ink-3:#767d76;
    --line:#272c29; --line-2:#343a36;
    --accent:#48b795; --accent-ink:#0c1512; --accent-soft:#1d312a;
    --good:#3fbf6f; --warn:#e0a33a;
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
    --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --grid:#2c2c2a; --axis:#383835;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0f1211; --surface:#171b19; --surface-2:#1e2320;
  --ink:#f0f2ee; --ink-2:#a7aea7; --ink-3:#767d76;
  --line:#272c29; --line-2:#343a36;
  --accent:#48b795; --accent-ink:#0c1512; --accent-soft:#1d312a;
  --good:#3fbf6f; --warn:#e0a33a;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --grid:#2c2c2a; --axis:#383835;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25);
}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--ink);
  font-family:"IBM Plex Sans JP",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;font-variant-numeric:tabular-nums}
.wrap{max-width:1000px;margin:0 auto;padding:0 20px 72px}
header.site{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:28px 0 6px}
.wordmark{font-size:22px;font-weight:700;letter-spacing:-.01em;margin:0}
.wordmark .to30{color:var(--accent)}
.countdown{font-size:13px;color:var(--ink-2)}
.countdown b{color:var(--ink);font-weight:600}
.savechip{font-size:12px;color:var(--ink-3);min-height:18px}
.savechip.busy{color:var(--warn)}
.savechip.ok{color:var(--good)}
nav.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);margin:10px 0 24px;overflow-x:auto}
nav.tabs button{
  appearance:none;background:none;border:none;border-bottom:2px solid transparent;
  padding:10px 14px;font:inherit;font-weight:500;color:var(--ink-2);cursor:pointer;white-space:nowrap;
}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
nav.tabs button:focus-visible,button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:4px}
h2{font-size:16px;font-weight:600;margin:0 0 4px}
h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin:0 0 12px}
.sub{font-size:13px;color:var(--ink-2);margin:0 0 16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;box-shadow:var(--shadow)}
.grid{display:grid;gap:16px}
.grid.cols3{grid-template-columns:repeat(3,1fr)}
.grid.cols2{grid-template-columns:repeat(2,1fr)}
@media (max-width:760px){.grid.cols3,.grid.cols2{grid-template-columns:1fr}}
.stack{display:flex;flex-direction:column;gap:16px}
.tile .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-2);margin-bottom:6px}
.tile .value{font-size:26px;font-weight:600;line-height:1.2}
.tile .hint{font-size:12px;color:var(--ink-3);margin-top:6px}
.range-lohi{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-2);margin-top:8px}
.rangebar{height:6px;border-radius:3px;background:linear-gradient(90deg,var(--line-2),var(--accent));margin-top:4px}
.goalrow{display:flex;flex-direction:column;gap:4px;padding:10px 0;border-top:1px solid var(--line)}
.goalrow:first-of-type{border-top:none;padding-top:0}
.goalrow .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.goalrow .name{font-weight:500}
.goalrow .pct{font-size:12px;color:var(--ink-2)}
.track{height:8px;background:var(--surface-2);border-radius:4px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:4px}
.fill.over{background:var(--good)}
.alloc-row{display:grid;grid-template-columns:12px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.alloc-row .sw{width:12px;height:12px;border-radius:3px}
.alloc-row .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px}
.alloc-row .amt{font-size:13px;color:var(--ink-2)}
.alloc-bar{grid-column:2/4;height:6px;background:var(--surface-2);border-radius:3px;overflow:hidden}
.alloc-bar i{display:block;height:100%;border-radius:3px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-2);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line-2)}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:none}
td.r,th.r{text-align:right}
.tablewrap{overflow-x:auto}
.muted{color:var(--ink-3)}
.btn{
  appearance:none;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);
  font:inherit;font-weight:500;font-size:14px;border-radius:8px;padding:8px 14px;cursor:pointer;
}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);color:var(--accent-ink)}
.btn.tiny{font-size:12px;padding:4px 9px;border-radius:6px}
.btn.danger-armed{border-color:var(--s8);color:var(--s8)}
input,select{
  font:inherit;color:var(--ink);background:var(--surface);
  border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;max-width:100%;
}
input[type=number]{font-family:"IBM Plex Mono",ui-monospace,monospace;font-variant-numeric:tabular-nums}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--ink-2);font-weight:500}
.formrow{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
.formrow .grow{flex:1 1 220px}
.chart{width:100%;display:block}
.chart text{font-family:"IBM Plex Sans JP",system-ui,sans-serif}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:12px;color:var(--ink-2);margin-bottom:10px}
.legend .it{display:flex;align-items:center;gap:6px}
.legend .sw{width:14px;height:3px;border-radius:2px}
.tooltip{
  position:fixed;z-index:10;pointer-events:none;background:var(--surface);border:1px solid var(--line-2);
  border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:var(--shadow);display:none;max-width:260px;
}
.tooltip .tt-t{font-weight:600;margin-bottom:3px}
.tooltip .tt-r{display:flex;justify-content:space-between;gap:14px}
.tooltip .tt-r .k{display:flex;align-items:center;gap:5px;color:var(--ink-2)}
.tooltip .sw{width:9px;height:9px;border-radius:2px;display:inline-block}
.note{font-size:12.5px;color:var(--ink-2);background:var(--surface-2);border-radius:8px;padding:10px 12px;margin-top:14px}
.note b{color:var(--ink)}
.stageuntil{font-size:12px;color:var(--ink-3)}
.empty{color:var(--ink-3);font-size:13px;padding:14px 0;text-align:center}
footer.site{margin-top:40px;font-size:12px;color:var(--ink-3);text-align:center}
@media (prefers-reduced-motion:no-preference){
  .fill,.alloc-bar i{transition:width .4s ease}
}
</style>
</head>
<body>

<div id="app" class="wrap"></div>
<div id="tt" class="tooltip" role="status"></div>

<script type="application/json" id="p30-state">{"seed":true}</script>
<script id="p30-app">
(function(){
"use strict";
/* ---------- state ---------- */
var SEED = {
  v:1, updatedAt:0,
  targetMonth:"2033-08",
  rates:{low:2, base:5, high:8},
  stages:[
    {id:"st1", label:"Student", monthly:20000, until:"2028-03"},
    {id:"st2", label:"After graduation", monthly:60000, until:null}
  ],
  goals:[
    {id:"g1", name:"Emergency Fund", target:300000, current:228000},
    {id:"g2", name:"House Fund", target:3000000, current:0}
  ],
  investments:[
    {id:"i1", date:"2026-08-08", fund:"eMAXIS Slim 全世界株式（オール・カントリー）", amount:10000},
    {id:"i2", date:"2026-08-08", fund:"eMAXIS Slim 米国株式（S&P500）", amount:10000}
  ]
};
var LSKEY="path-to-30:v1";
var state=null, artifactNS=null, artifactTried=false, canPublish=true;
var activeTab=(function(){try{return sessionStorage.getItem("p30-tab")||"dash"}catch(e){return "dash"}})();
var saveTimer=null, armedDelete=null, armTimer=null;

function loadState(){
  var embedded=null, local=null;
  try{ embedded=JSON.parse(document.getElementById("p30-state").textContent); }catch(e){}
  if(embedded && embedded.seed) embedded=null;
  try{ var raw=localStorage.getItem(LSKEY); if(raw) local=JSON.parse(raw); }catch(e){}
  if(embedded && local) return (local.updatedAt>embedded.updatedAt)? local : embedded;
  return embedded || local || JSON.parse(JSON.stringify(SEED));
}

function save(){
  state.updatedAt=Date.now();
  try{ localStorage.setItem(LSKEY, JSON.stringify(state)); }catch(e){}
  scheduleSaveChip("busy");
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(publishState, 2000);
}

function scheduleSaveChip(mode){
  var el=document.getElementById("savechip"); if(!el) return;
  if(mode==="busy"){ el.textContent="Saving…"; el.className="savechip busy"; }
  else if(mode==="ok"){ el.textContent="Saved"; el.className="savechip ok";
    setTimeout(function(){ if(el.textContent==="Saved"){el.textContent="";el.className="savechip";} },2500); }
  else { el.textContent=mode||""; el.className="savechip"; }
}

function buildDoc(s){
  var style=document.getElementById("p30-style").textContent;
  var app=document.getElementById("p30-app").textContent;
  var json=JSON.stringify(s).replace(/</g,"\\u003c");
  var SC="script";
  return "<!doctype html>\n<html lang=\"en\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<title>Path to 30</title>\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+JP:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap\">\n<style id=\"p30-style\">"+style+"</style>\n</head>\n<body>\n<div id=\"app\" class=\"wrap\"></div>\n<div id=\"tt\" class=\"tooltip\" role=\"status\"></div>\n<"+SC+" type=\"application/json\" id=\"p30-state\">"+json+"</"+SC+">\n<"+SC+" id=\"p30-app\">"+app+"</"+SC+">\n</body>\n</html>";
}

function publishState(){
  saveTimer=null;
  if(!canPublish){ scheduleSaveChip("ok"); return; }
  ensureArtifact().then(function(ns){
    if(!ns){ scheduleSaveChip("ok"); return; }
    try{ sessionStorage.setItem("p30-tab", activeTab); }catch(e){}
    ns.publish(buildDoc(state)).then(function(){
      scheduleSaveChip("ok"); /* view reloads */
    }).catch(function(err){
      var code=err&&err.code;
      if(code==="conflict"){ /* shell reloads to winner */ return; }
      if(code==="not_writer"||code==="not_granted"||code==="not_declared"||code==="capability_disabled"||code==="capability_removed"){
        canPublish=false; scheduleSaveChip("Saved on this device only");
        return;
      }
      if(code==="rate_limited"){ saveTimer=setTimeout(publishState,15000); return; }
      scheduleSaveChip("Saved on this device only");
    });
  });
}

function ensureArtifact(){
  if(artifactTried) return Promise.resolve(artifactNS);
  artifactTried=true;
  if(typeof window.claude==="undefined" || typeof window.claude.use!=="function"){
    artifactNS=null; return Promise.resolve(null);
  }
  return window.claude.use("artifact").then(function(ns){ artifactNS=ns||null; return artifactNS; })
    .catch(function(){ artifactNS=null; return null; });
}

/* ---------- helpers ---------- */
function uid(){ return "x"+Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c];}); }
function yen(n){ return "¥"+Math.round(n).toLocaleString("ja-JP"); }
function yenCompact(n){
  var a=Math.abs(n);
  if(a>=1e6) return "¥"+(n/1e6).toFixed(n%1e6===0?0:1)+"M";
  if(a>=1e3) return "¥"+Math.round(n/1e3)+"k";
  return "¥"+Math.round(n);
}
function ymNow(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function ymAdd(ym,k){ var p=ym.split("-"),y=+p[0],m=+p[1]-1+k; return (y+Math.floor(m/12))+"-"+String((m%12+12)%12+1).padStart(2,"0"); }
function ymDiff(a,b){ var pa=a.split("-"),pb=b.split("-"); return (+pb[0]-+pa[0])*12+(+pb[1]-+pa[1]); }
function ymLabel(ym){ var p=ym.split("-"); return p[0]+"/"+p[1]; }
function monthName(ym){ var p=ym.split("-"); return ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][+p[1]-1]+" "+p[0]; }
function todayISO(){ var d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
var SERIES=["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
function seriesColor(i){ return "var("+SERIES[i%8]+")"; }

/* ---------- derived data ---------- */
function totalInvested(){ return state.investments.reduce(function(s,x){return s+(+x.amount||0)},0); }
function byFund(){
  var m={}; state.investments.forEach(function(x){ m[x.fund]=(m[x.fund]||0)+(+x.amount||0); });
  var arr=Object.keys(m).map(function(k){return {fund:k,amount:m[k]}});
  arr.sort(function(a,b){return b.amount-a.amount});
  if(arr.length>8){
    var rest=arr.slice(7).reduce(function(s,x){return s+x.amount},0);
    arr=arr.slice(0,7); arr.push({fund:"Other",amount:rest});
  }
  return arr;
}
function byMonth(){
  var m={}; state.investments.forEach(function(x){ var ym=(x.date||"").slice(0,7); if(ym) m[ym]=(m[ym]||0)+(+x.amount||0); });
  return m;
}
function fundNames(){
  var s=[]; state.investments.forEach(function(x){ if(s.indexOf(x.fund)<0) s.push(x.fund); }); return s;
}
function monthlyFor(ym){
  var stages=state.stages;
  for(var i=0;i<stages.length;i++){
    var st=stages[i];
    if(i===stages.length-1 || !st.until) return +st.monthly||0;
    if(ymDiff(ym, st.until)>=0) return +st.monthly||0;
  }
  return 0;
}
function simulate(annualPct){
  var start=ymNow(), end=state.targetMonth;
  var n=Math.max(0, ymDiff(start,end));
  var f=Math.pow(1+annualPct/100, 1/12);
  var v=totalInvested();
  var pts=[{ym:start, value:v}];
  var ym=start;
  for(var i=0;i<n;i++){
    ym=ymAdd(ym,1);
    v=v*f + monthlyFor(ym);
    pts.push({ym:ym, value:v});
  }
  return pts;
}
function yearRows(){
  var rows=[], sims={low:simulate(state.rates.low), base:simulate(state.rates.base), high:simulate(state.rates.high)};
  var end=state.targetMonth;
  var map=function(pts){ var m={}; pts.forEach(function(p){ m[p.ym]=p.value; }); return m; };
  var ml=map(sims.low), mb=map(sims.base), mh=map(sims.high);
  var seen={};
  sims.base.forEach(function(p){
    var y=p.ym.slice(0,4);
    var isDec=p.ym.slice(5)==="12", isEnd=p.ym===end;
    if((isDec||isEnd) && !seen[y+(isEnd?"e":"")]){
      seen[y+(isEnd?"e":"")]=1;
      rows.push({label:isEnd?monthName(p.ym)+" (age 30)":"End of "+y, ym:p.ym, low:ml[p.ym], base:mb[p.ym], high:mh[p.ym]});
    }
  });
  var out=[],k={}; rows.forEach(function(r){ if(!k[r.ym]){k[r.ym]=1;out.push(r);} });
  return out;
}

/* ---------- rendering ---------- */
var app=document.getElementById("app");
function render(){
  var months=Math.max(0,ymDiff(ymNow(), state.targetMonth));
  var html="";
  html+='<header class="site"><div><h1 class="wordmark">Path <span class="to30">to 30</span></h1>'+
    '<div class="countdown"><b class="num">'+months+'</b> months until '+esc(monthName(state.targetMonth))+' <span id="savechip" class="savechip"></span></div></div>'+
    '</header>';
  html+='<nav class="tabs" role="tablist">'+
    tabBtn("dash","Dashboard")+tabBtn("inv","Investments")+tabBtn("goals","Goals")+tabBtn("fc","Forecast")+'</nav>';
  if(activeTab==="dash") html+=viewDash();
  else if(activeTab==="inv") html+=viewInvest();
  else if(activeTab==="goals") html+=viewGoals();
  else html+=viewForecast();
  html+='<footer class="site">Path to 30 — amounts in JPY. Scenarios are illustrations, not guarantees.</footer>';
  app.innerHTML=html;
  bind();
}
function tabBtn(id,label){
  return '<button role="tab" aria-selected="'+(activeTab===id)+'" data-tab="'+id+'">'+label+'</button>';
}

/* ----- dashboard ----- */
function viewDash(){
  var inv=totalInvested();
  var lo=simulate(state.rates.low), hi=simulate(state.rates.high), base=simulate(state.rates.base);
  var vlo=lo[lo.length-1].value, vhi=hi[hi.length-1].value, vb=base[base.length-1].value;
  var thisMonth=byMonth()[ymNow()]||0;
  var h='<div class="stack">';
  h+='<div class="grid cols3">';
  h+='<div class="card tile"><div class="label">Total invested</div><div class="value num">'+yen(inv)+'</div>'+
     '<div class="hint">'+state.investments.length+' purchase'+(state.investments.length===1?"":"s")+' logged</div></div>';
  h+='<div class="card tile"><div class="label">Estimate at 30</div><div class="value num">'+yenCompact(vlo)+'–'+yenCompact(vhi)+'</div>'+
     '<div class="rangebar"></div><div class="range-lohi"><span>'+state.rates.low+'%/yr</span><span>'+state.rates.high+'%/yr</span></div>'+
     '<div class="hint">Base ('+state.rates.base+'%/yr): <span class="num">'+yen(vb)+'</span> — plausible, not planned</div></div>';
  h+='<div class="card tile"><div class="label">This month</div><div class="value num">'+yen(thisMonth)+'</div>'+
     '<div class="hint">Plan for '+esc(monthName(ymNow()))+': <span class="num">'+yen(monthlyFor(ymNow()))+'</span>/month</div></div>';
  h+='</div>';

  h+='<div class="grid cols2">';
  /* goals mini */
  h+='<div class="card"><h3>Goal progress</h3>';
  if(state.goals.length===0) h+='<div class="empty">No goals yet — add some in the Goals tab.</div>';
  state.goals.forEach(function(g){
    var pct=g.target>0? Math.min(100, g.current/g.target*100):0;
    h+='<div class="goalrow"><div class="top"><span class="name">'+esc(g.name)+'</span>'+
       '<span class="pct num">'+yen(g.current)+' / '+yen(g.target)+' · '+Math.round(pct)+'%</span></div>'+
       '<div class="track"><div class="fill'+(pct>=100?" over":"")+'" style="width:'+pct+'%"></div></div></div>';
  });
  h+='</div>';
  /* allocation */
  h+='<div class="card"><h3>Allocation by fund</h3>';
  var alloc=byFund(), tot=totalInvested();
  if(alloc.length===0) h+='<div class="empty">Log a purchase to see allocation.</div>';
  alloc.forEach(function(a,i){
    var pct=tot>0? a.amount/tot*100:0;
    h+='<div class="alloc-row"><span class="sw" style="background:'+seriesColor(i)+'"></span>'+
       '<span class="nm" title="'+esc(a.fund)+'">'+esc(a.fund)+'</span>'+
       '<span class="amt num">'+yen(a.amount)+' · '+pct.toFixed(1)+'%</span>'+
       '<div class="alloc-bar"><i style="width:'+pct+'%;background:'+seriesColor(i)+'"></i></div></div>';
  });
  h+='</div></div>';

  /* monthly history */
  h+='<div class="card"><h3>Monthly contributions</h3>'+monthlyChart()+'</div>';
  h+='</div>';
  return h;
}

function monthlyChart(){
  var m=byMonth(), now=ymNow();
  var months=[]; for(var i=11;i>=0;i--) months.push(ymAdd(now,-i));
  var vals=months.map(function(ym){return m[ym]||0});
  var max=Math.max.apply(null, vals.concat([1]));
  var W=920,H=190,padL=52,padR=10,padT=18,padB=26;
  var iw=(W-padL-padR)/months.length;
  var bw=Math.min(40, iw*0.6);
  var svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Monthly contributions, last 12 months">';
  /* gridlines */
  for(var g=0; g<=2; g++){
    var val=max*g/2, y=H-padB-(H-padT-padB)*g/2;
    svg+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>';
    svg+='<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--ink-3)">'+yenCompact(val)+'</text>';
  }
  months.forEach(function(ym,i){
    var v=vals[i];
    var x=padL+iw*i+(iw-bw)/2;
    var bh=(H-padT-padB)*(v/max);
    var y=H-padB-bh;
    if(v>0){
      var r=Math.min(4,bh);
      svg+='<path d="M'+x+' '+(H-padB)+' L'+x+' '+(y+r)+' Q'+x+' '+y+' '+(x+r)+' '+y+' L'+(x+bw-r)+' '+y+' Q'+(x+bw)+' '+y+' '+(x+bw)+' '+(y+r)+' L'+(x+bw)+' '+(H-padB)+' Z" fill="var(--s1)"/>';
    }
    svg+='<text x="'+(padL+iw*i+iw/2)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--ink-3)">'+ymLabel(ym).slice(2)+'</text>';
    svg+='<rect data-tt="'+esc(monthName(ym))+'|'+yen(v)+'" x="'+(padL+iw*i)+'" y="'+padT+'" width="'+iw+'" height="'+(H-padT-padB)+'" fill="transparent"/>';
  });
  svg+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(H-padB)+'" y2="'+(H-padB)+'" stroke="var(--axis)" stroke-width="1"/>';
  svg+='</svg>';
  return svg;
}

/* ----- investments ----- */
function viewInvest(){
  var h='<div class="stack">';
  h+='<div class="card"><h3>Log a purchase</h3><form id="addform" class="formrow">'+
    '<label class="f">Date<input required type="date" name="date" value="'+todayISO()+'"></label>'+
    '<label class="f grow">Fund<input required type="text" name="fund" list="funds" placeholder="e.g. eMAXIS Slim 全世界株式" autocomplete="off"></label>'+
    '<label class="f">Amount (¥)<input required type="number" name="amount" min="1" step="1" placeholder="10000" style="width:130px"></label>'+
    '<button class="btn primary" type="submit">Add</button></form>'+
    '<datalist id="funds">'+fundNames().map(function(f){return '<option value="'+esc(f)+'">'}).join("")+'</datalist></div>';

  h+='<div class="card"><h3>Ledger</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Fund</th><th class="r">Amount</th><th></th></tr></thead><tbody>';
  var inv=state.investments.slice().sort(function(a,b){ return a.date<b.date?1:(a.date>b.date?-1:0); });
  if(inv.length===0) h+='<tr><td colspan="4" class="empty">Nothing logged yet.</td></tr>';
  inv.forEach(function(x){
    var armed = armedDelete==="inv:"+x.id;
    h+='<tr><td class="num muted">'+esc(x.date)+'</td><td>'+esc(x.fund)+'</td><td class="r num">'+yen(x.amount)+'</td>'+
       '<td class="r"><button class="btn tiny'+(armed?' danger-armed':'')+'" data-del-inv="'+x.id+'">'+(armed?"Sure?":"Delete")+'</button></td></tr>';
  });
  h+='</tbody></table></div></div>';

  var m=byMonth(); var keys=Object.keys(m).sort().reverse();
  h+='<div class="card"><h3>Monthly summary</h3><div class="tablewrap"><table><thead><tr><th>Month</th><th class="r">Total</th><th class="r">Purchases</th></tr></thead><tbody>';
  if(keys.length===0) h+='<tr><td colspan="3" class="empty">—</td></tr>';
  keys.forEach(function(ym){
    var count=state.investments.filter(function(x){return (x.date||"").slice(0,7)===ym}).length;
    h+='<tr><td>'+esc(monthName(ym))+'</td><td class="r num">'+yen(m[ym])+'</td><td class="r num">'+count+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  h+='</div>';
  return h;
}

/* ----- goals ----- */
function viewGoals(){
  var h='<div class="stack">';
  state.goals.forEach(function(g){
    var pct=g.target>0? Math.min(100,g.current/g.target*100):0;
    var armed=armedDelete==="goal:"+g.id;
    h+='<div class="card"><div class="formrow" style="justify-content:space-between">'+
      '<label class="f grow">Goal name<input type="text" data-goal="'+g.id+'" data-k="name" value="'+esc(g.name)+'"></label>'+
      '<label class="f">Current (¥)<input type="number" min="0" step="1" style="width:140px" data-goal="'+g.id+'" data-k="current" value="'+(+g.current||0)+'"></label>'+
      '<label class="f">Target (¥)<input type="number" min="1" step="1" style="width:140px" data-goal="'+g.id+'" data-k="target" value="'+(+g.target||0)+'"></label>'+
      '<button class="btn tiny'+(armed?' danger-armed':'')+'" data-del-goal="'+g.id+'">'+(armed?"Sure?":"Delete")+'</button></div>'+
      '<div style="margin-top:14px"><div class="track"><div class="fill'+(pct>=100?" over":"")+'" style="width:'+pct+'%"></div></div>'+
      '<div class="range-lohi"><span class="num">'+yen(g.current)+'</span><span class="num">'+Math.round(pct)+'% of '+yen(g.target)+'</span></div></div></div>';
  });
  h+='<div><button class="btn" id="addgoal">+ Add a goal</button></div>';
  h+='</div>';
  return h;
}

/* ----- forecast ----- */
function viewForecast(){
  var h='<div class="stack">';
  h+='<div class="card"><h3>Life stages</h3><p class="sub">How much you expect to invest per month, stage by stage. The last stage runs until your target month.</p>';
  h+='<div class="tablewrap"><table><thead><tr><th>Stage</th><th class="r">¥ / month</th><th>Until</th><th></th></tr></thead><tbody>';
  state.stages.forEach(function(st,i){
    var last=i===state.stages.length-1;
    var armed=armedDelete==="stage:"+st.id;
    h+='<tr><td><input type="text" data-stage="'+st.id+'" data-k="label" value="'+esc(st.label)+'" style="min-width:140px"></td>'+
      '<td class="r"><input type="number" min="0" step="1000" style="width:120px" data-stage="'+st.id+'" data-k="monthly" value="'+(+st.monthly||0)+'"></td>'+
      '<td>'+(last?'<span class="stageuntil">target ('+esc(ymLabel(state.targetMonth))+')</span>'
              :'<input type="month" data-stage="'+st.id+'" data-k="until" value="'+esc(st.until||"")+'">')+'</td>'+
      '<td class="r">'+(state.stages.length>1?'<button class="btn tiny'+(armed?' danger-armed':'')+'" data-del-stage="'+st.id+'">'+(armed?"Sure?":"Delete")+'</button>':'')+'</td></tr>';
  });
  h+='</tbody></table></div>';
  h+='<div class="formrow" style="margin-top:14px"><button class="btn" id="addstage">+ Add a stage</button>'+
     '<label class="f" style="margin-left:auto">I turn 30 in<input type="month" id="targetmonth" value="'+esc(state.targetMonth)+'"></label></div></div>';

  h+='<div class="card"><h3>Scenario rates (% per year)</h3><div class="formrow">'+
    '<label class="f">Pessimistic<input type="number" step="0.5" style="width:100px" data-rate="low" value="'+state.rates.low+'"></label>'+
    '<label class="f">Base<input type="number" step="0.5" style="width:100px" data-rate="base" value="'+state.rates.base+'"></label>'+
    '<label class="f">Optimistic<input type="number" step="0.5" style="width:100px" data-rate="high" value="'+state.rates.high+'"></label>'+
    '</div><div class="note">Over a horizon this long, ending near the <b>pessimistic</b> line is entirely possible. Treat the base line as plausible — not planned.</div></div>';

  h+='<div class="card"><h3>Projection to '+esc(monthName(state.targetMonth))+'</h3>'+forecastChart()+'</div>';

  var rows=yearRows();
  h+='<div class="card"><h3>Year by year</h3><div class="tablewrap"><table><thead><tr><th>Point</th>'+
     '<th class="r">'+state.rates.low+'%/yr</th><th class="r">'+state.rates.base+'%/yr</th><th class="r">'+state.rates.high+'%/yr</th></tr></thead><tbody>';
  rows.forEach(function(r){
    h+='<tr><td>'+esc(r.label)+'</td><td class="r num">'+yen(r.low)+'</td><td class="r num">'+yen(r.base)+'</td><td class="r num">'+yen(r.high)+'</td></tr>';
  });
  h+='</tbody></table></div></div>';
  h+='</div>';
  return h;
}

function forecastChart(){
  var sims=[
    {key:"low",  name:state.rates.low+"%",  color:"var(--s2)", pts:simulate(state.rates.low)},
    {key:"base", name:state.rates.base+"%", color:"var(--s1)", pts:simulate(state.rates.base)},
    {key:"high", name:state.rates.high+"%", color:"var(--s3)", pts:simulate(state.rates.high)}
  ];
  var n=sims[0].pts.length;
  if(n<2) return '<div class="empty">Target month is in the past — set a future month above.</div>';
  var max=0; sims.forEach(function(s){ max=Math.max(max, s.pts[s.pts.length-1].value); });
  max=max*1.06||1;
  var W=920,H=300,padL=60,padR=64,padT=16,padB=28;
  function X(i){ return padL+(W-padL-padR)*i/(n-1); }
  function Y(v){ return H-padB-(H-padT-padB)*v/max; }
  var svg='<div class="legend">'+sims.map(function(s){
    return '<span class="it"><span class="sw" style="background:'+s.color+'"></span>'+esc(s.name)+' per year</span>';
  }).join("")+'</div>';
  svg+='<svg class="chart" id="fchart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Projected value under three growth scenarios">';
  for(var g=0;g<=3;g++){
    var val=max*g/3, y=Y(val);
    svg+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+y+'" y2="'+y+'" stroke="var(--grid)" stroke-width="1"/>';
    svg+='<text x="'+(padL-8)+'" y="'+(y+4)+'" text-anchor="end" font-size="11" fill="var(--ink-3)">'+yenCompact(val)+'</text>';
  }
  /* x labels: each January */
  for(var i=0;i<n;i++){
    var ym=sims[0].pts[i].ym;
    if(ym.slice(5)==="01"||i===0){
      svg+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-size="11" fill="var(--ink-3)">'+ym.slice(0,4)+'</text>';
    }
  }
  sims.forEach(function(s){
    var d=s.pts.map(function(p,i){ return (i===0?"M":"L")+X(i).toFixed(1)+" "+Y(p.value).toFixed(1); }).join("");
    svg+='<path d="'+d+'" fill="none" stroke="'+s.color+'" stroke-width="2" stroke-linejoin="round"/>';
    var lastY=Y(s.pts[n-1].value);
    svg+='<circle cx="'+X(n-1)+'" cy="'+lastY+'" r="3.5" fill="'+s.color+'"/>';
    svg+='<text x="'+(W-padR+8)+'" y="'+(lastY+4)+'" font-size="11" font-weight="600" fill="var(--ink-2)">'+esc(s.name)+'</text>';
  });
  svg+='<line x1="'+padL+'" x2="'+(W-padR)+'" y1="'+(H-padB)+'" y2="'+(H-padB)+'" stroke="var(--axis)" stroke-width="1"/>';
  svg+='<line id="fcx" x1="0" x2="0" y1="'+padT+'" y2="'+(H-padB)+'" stroke="var(--axis)" stroke-width="1" opacity="0"/>';
  svg+='<rect id="fhover" x="'+padL+'" y="'+padT+'" width="'+(W-padL-padR)+'" height="'+(H-padT-padB)+'" fill="transparent"/>';
  svg+='</svg>';
  /* stash for hover handler */
  fchartData={sims:sims,n:n,W:W,padL:padL,padR:padR};
  return svg;
}
var fchartData=null;

/* ---------- events ---------- */
function bind(){
  app.querySelectorAll("nav.tabs button").forEach(function(b){
    b.addEventListener("click",function(){
      activeTab=b.getAttribute("data-tab");
      try{ sessionStorage.setItem("p30-tab",activeTab); }catch(e){}
      armedDelete=null; render();
    });
  });
  var form=document.getElementById("addform");
  if(form) form.addEventListener("submit",function(ev){
    ev.preventDefault();
    var fd=new FormData(form);
    var fund=String(fd.get("fund")||"").trim();
    var amount=Math.round(+fd.get("amount"));
    var date=String(fd.get("date")||"");
    if(!fund||!(amount>0)||!date) return;
    state.investments.push({id:uid(), date:date, fund:fund, amount:amount});
    save(); render();
  });
  app.querySelectorAll("[data-del-inv]").forEach(function(b){ armDelete(b,"inv",b.getAttribute("data-del-inv"),function(id){
    state.investments=state.investments.filter(function(x){return x.id!==id});
  });});
  app.querySelectorAll("[data-del-goal]").forEach(function(b){ armDelete(b,"goal",b.getAttribute("data-del-goal"),function(id){
    state.goals=state.goals.filter(function(x){return x.id!==id});
  });});
  app.querySelectorAll("[data-del-stage]").forEach(function(b){ armDelete(b,"stage",b.getAttribute("data-del-stage"),function(id){
    state.stages=state.stages.filter(function(x){return x.id!==id});
    if(state.stages.length) state.stages[state.stages.length-1].until=null;
  });});
  app.querySelectorAll("[data-goal]").forEach(function(inp){
    inp.addEventListener("change",function(){
      var g=state.goals.find(function(x){return x.id===inp.getAttribute("data-goal")});
      if(!g) return;
      var k=inp.getAttribute("data-k");
      g[k]= k==="name"? inp.value.trim()||g.name : Math.max(0,Math.round(+inp.value||0));
      save(); render();
    });
  });
  app.querySelectorAll("[data-stage]").forEach(function(inp){
    inp.addEventListener("change",function(){
      var st=state.stages.find(function(x){return x.id===inp.getAttribute("data-stage")});
      if(!st) return;
      var k=inp.getAttribute("data-k");
      if(k==="label") st.label=inp.value.trim()||st.label;
      else if(k==="monthly") st.monthly=Math.max(0,Math.round(+inp.value||0));
      else if(k==="until"&&inp.value) st.until=inp.value;
      save(); render();
    });
  });
  app.querySelectorAll("[data-rate]").forEach(function(inp){
    inp.addEventListener("change",function(){
      var k=inp.getAttribute("data-rate"), v=+inp.value;
      if(isFinite(v)&&v>-50&&v<100){ state.rates[k]=v; save(); render(); }
    });
  });
  var tm=document.getElementById("targetmonth");
  if(tm) tm.addEventListener("change",function(){
    if(tm.value && ymDiff(ymNow(),tm.value)>0){ state.targetMonth=tm.value; save(); render(); }
  });
  var ag=document.getElementById("addgoal");
  if(ag) ag.addEventListener("click",function(){
    state.goals.push({id:uid(), name:"New goal", target:100000, current:0});
    save(); render();
  });
  var as=document.getElementById("addstage");
  if(as) as.addEventListener("click",function(){
    var last=state.stages[state.stages.length-1];
    if(last) last.until=ymAdd(state.targetMonth,-12);
    state.stages.push({id:uid(), label:"New stage", monthly:last?+last.monthly||0:30000, until:null});
    save(); render();
  });
  bindTooltips();
}
function armDelete(btn,kind,id,doDelete){
  btn.addEventListener("click",function(){
    var key=kind+":"+id;
    if(armedDelete===key){ armedDelete=null; if(armTimer)clearTimeout(armTimer); doDelete(id); save(); render(); }
    else{
      armedDelete=key; render();
      if(armTimer) clearTimeout(armTimer);
      armTimer=setTimeout(function(){ armedDelete=null; render(); },3000);
    }
  });
}

/* ---------- tooltips ---------- */
var tt=document.getElementById("tt");
function showTT(html,x,y){
  tt.innerHTML=html; tt.style.display="block";
  var r=tt.getBoundingClientRect();
  var left=Math.min(x+14, window.innerWidth-r.width-8);
  var top=Math.max(8, y-r.height-12);
  tt.style.left=left+"px"; tt.style.top=top+"px";
}
function hideTT(){ tt.style.display="none"; }
function bindTooltips(){
  app.querySelectorAll("[data-tt]").forEach(function(el){
    el.addEventListener("mousemove",function(ev){
      var p=el.getAttribute("data-tt").split("|");
      showTT('<div class="tt-t">'+esc(p[0])+'</div><div class="tt-r"><span class="k"><span class="sw" style="background:var(--s1)"></span>Contributed</span><span class="num">'+esc(p[1])+'</span></div>', ev.clientX, ev.clientY);
    });
    el.addEventListener("mouseleave",hideTT);
  });
  var hover=document.getElementById("fhover");
  if(hover && fchartData){
    var svg=document.getElementById("fchart"), cx=document.getElementById("fcx");
    hover.addEventListener("mousemove",function(ev){
      var d=fchartData;
      var rect=svg.getBoundingClientRect();
      var sx=(ev.clientX-rect.left)*(d.W/rect.width);
      var frac=(sx-d.padL)/(d.W-d.padL-d.padR);
      var i=Math.round(Math.max(0,Math.min(1,frac))*(d.n-1));
      var X=d.padL+(d.W-d.padL-d.padR)*i/(d.n-1);
      cx.setAttribute("x1",X); cx.setAttribute("x2",X); cx.setAttribute("opacity","1");
      var ym=d.sims[0].pts[i].ym;
      var rows=d.sims.slice().reverse().map(function(s){
        return '<div class="tt-r"><span class="k"><span class="sw" style="background:'+s.color+'"></span>'+esc(s.name)+'</span><span class="num">'+yen(s.pts[i].value)+'</span></div>';
      }).join("");
      showTT('<div class="tt-t">'+esc(monthName(ym))+'</div>'+rows, ev.clientX, ev.clientY);
    });
    hover.addEventListener("mouseleave",function(){ hideTT(); cx.setAttribute("opacity","0"); });
  }
}

/* ---------- boot ---------- */
state=loadState();
render();
ensureArtifact();
})();
</script>
